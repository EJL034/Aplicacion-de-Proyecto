<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control de Asistencia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body { font-family: Inter, sans-serif; background: #f4f6f9; }
    </style>
</head>
<body class="min-h-screen bg-[#f4f6f9] p-6 text-gray-800">
    <div class="max-w-7xl mx-auto space-y-6">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-xs uppercase tracking-wider text-gray-500 font-semibold">Control de Asistencia</p>
                <h1 class="text-2xl font-bold text-gray-900">Calendario y colaboradores</h1>
            </div>
            <button onclick="window.close()" class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-100">
                <i class="fa-solid fa-xmark mr-2"></i>Cerrar
            </button>
        </div>

        <div class="grid gap-6 lg:grid-cols-[1.4fr_0.9fr]">
            <section class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm">
                <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between mb-4">
                    <div>
                        <h2 class="text-lg font-semibold text-gray-900">Calendario</h2>
                        <p class="text-sm text-gray-500">Revisa los días y el estado de los colaboradores.</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <label for="selector-mes" class="text-sm font-medium text-gray-600">
                            <i class="fa-solid fa-calendar-alt mr-2 text-blue-600"></i>Mes
                        </label>
                        <input id="selector-mes" type="month" class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm font-medium text-gray-700 focus:border-blue-500 focus:outline-none" />
                    </div>
                </div>
                <div class="flex justify-end mb-3">
                    <div class="rounded-full bg-blue-50 px-3 py-1 text-sm font-semibold text-blue-700">
                        <i class="fa-solid fa-calendar-days mr-2"></i><span id="mes-actual"></span>
                    </div>
                </div>
                <div class="grid grid-cols-7 gap-2 text-center text-xs font-semibold uppercase text-gray-400">
                    <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
                </div>
                <div id="calendario" class="mt-3 grid grid-cols-7 gap-2"></div>
            </section>

            <section class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h2 class="text-lg font-semibold text-gray-900">Colaboradores</h2>
                        <p class="text-sm text-gray-500">Faltas y estado actual.</p>
                    </div>
                    <div class="rounded-full bg-amber-50 px-3 py-1 text-sm font-semibold text-amber-700">
                        <i class="fa-solid fa-user-group mr-2"></i><span id="total-colaboradores">0</span>
                    </div>
                </div>
                <div id="lista-colaboradores" class="space-y-3"></div>
            </section>
        </div>
    </div>

    <script>
        const colaboradores = [
            { nombre: 'Emanuel López', puesto: 'Administrador General', faltas: 0, estado: 'Presente' },
            { nombre: 'Valeria Chaves', puesto: 'Jefa de Cocina', faltas: 1, estado: 'Falta' },
            { nombre: 'Anthony Grant', puesto: 'Encargado de Caja', faltas: 2, estado: 'Falta' },
            { nombre: 'María Rojas', puesto: 'Cajera', faltas: 0, estado: 'Presente' }
        ];

        function renderizarCalendario() {
            const calendario = document.getElementById('calendario');
            const mesActual = document.getElementById('mes-actual');
            const selectorMes = document.getElementById('selector-mes');
            const valorSeleccionado = selectorMes.value;
            const fecha = valorSeleccionado
                ? new Date(`${valorSeleccionado}-01T00:00:00`)
                : new Date();
            const año = fecha.getFullYear();
            const mes = fecha.getMonth();
            const primerDia = new Date(año, mes, 1);
            const ultimoDia = new Date(año, mes + 1, 0);
            const primerDiaSemana = (primerDia.getDay() + 6) % 7;
            const totalDias = ultimoDia.getDate();

            if (!selectorMes.value) {
                selectorMes.value = `${año}-${String(mes + 1).padStart(2, '0')}`;
            }

            mesActual.textContent = fecha.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
            calendario.innerHTML = '';

            for (let i = 0; i < primerDiaSemana; i += 1) {
                const vacio = document.createElement('div');
                vacio.className = 'h-16 rounded-lg border border-dashed border-gray-200 bg-gray-50';
                calendario.appendChild(vacio);
            }

            for (let dia = 1; dia <= totalDias; dia += 1) {
                const cell = document.createElement('div');
                const today = dia === new Date().getDate() && mes === new Date().getMonth() && año === new Date().getFullYear();
                const estado = dia % 3 === 0 ? 'bg-amber-100 text-amber-700' : 'bg-green-100 text-green-700';
                cell.className = `h-16 rounded-lg border p-2 text-sm font-semibold flex flex-col justify-between ${today ? 'border-blue-400 bg-blue-50' : 'border-gray-200 bg-white'} ${estado}`;
                cell.innerHTML = `<span>${dia}</span><span class="text-[10px] uppercase">${dia % 3 === 0 ? 'Falta' : 'Ok'}</span>`;
                calendario.appendChild(cell);
            }
        }

        function renderizarColaboradores() {
            const contenedor = document.getElementById('lista-colaboradores');
            const total = document.getElementById('total-colaboradores');
            total.textContent = colaboradores.length;
            contenedor.innerHTML = '';

            colaboradores.forEach((colaborador) => {
                const card = document.createElement('div');
                card.className = 'rounded-xl border border-gray-200 p-3';
                const estadoClase = colaborador.estado === 'Presente' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700';
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="font-semibold text-gray-900">${colaborador.nombre}</p>
                            <p class="text-sm text-gray-500">${colaborador.puesto}</p>
                        </div>
                        <span class="rounded-full px-2.5 py-1 text-[10px] font-bold uppercase ${estadoClase}">${colaborador.estado}</span>
                    </div>
                    <div class="mt-2 text-sm text-gray-600">
                        <i class="fa-solid fa-exclamation-circle mr-2 text-amber-500"></i>Faltas: <span class="font-semibold">${colaborador.faltas}</span>
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const selectorMes = document.getElementById('selector-mes');
            const fechaActual = new Date();
            selectorMes.value = `${fechaActual.getFullYear()}-${String(fechaActual.getMonth() + 1).padStart(2, '0')}`;
            selectorMes.addEventListener('change', renderizarCalendario);
            renderizarCalendario();
            renderizarColaboradores();
        });
    </script>
</body>
</html>
